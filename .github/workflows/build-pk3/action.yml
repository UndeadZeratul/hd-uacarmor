name: Build PK3
description: Builds the PK3
runs:
  using: "composite"
  steps:
  - uses: actions/checkout@v4
  - uses: montudor/action-zip@v1
    with:
      args: zip -r "hd_uacarmour-${{ env.SUFFIX }}.pk3" . -i filter/* graphics/* patches/* sounds/* sprites/* zscript/* CHANGELOG.md CVARINFO HDCINFO KEYCONF LANGUAGE LICENSE MAPINFO MENUDEF lore.md readme.md SNDINFO TEXTURES zscript.zs
